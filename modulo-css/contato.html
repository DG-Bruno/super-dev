<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Byte Burger - Contato</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1 id="topo">Byte Burguer</h1>

        <nav>
            <a href="index.html">Cardápio</a>
            <a href="precos.html">Preços</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main>
        <section id="reserva">
            <h2>Faça a sua reserva</h2>
            <p>Preencha os dados abaixo e confirmamos por e-mail.</p>

            <form>

                <p>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" required maxlength="60">
                </p>

                <p>
                    <label for="email">Email:</label>
                    <input type="email" id="email" required>
                </p>

                <p>
                    <label for="wpp">WhatsApp:</label>
                    <input type="tel" id="wpp" pattern="[0-9]{11}" placeholder="47996789274">
                </p>

                <p>
                    <label for="numeroPessoas">Número de pessoas:</label>
                    <input type="number" id="numeroPessoas" min="1" max="20" required>
                </p>

                <p>
                    <label for="data">Data:</label>
                    <input type="date" id="data" required>
                </p>

                <p>
                    <label for="mesa">Preferência de Mesa:</label>
                    <select id="mesa">
                        <option>Perto da janela</option>
                        <option>Área externa</option>
                        <option>Tanto faz</option>
                    </select>
                </p>

                <p>
                    <label for="obs">Observaçôes:</label>
                    <textarea id="obs" maxlength="200"></textarea>
                </p>

                <button>Confirmar reserva</button>
            </form>
        </section>

        <section id="canais">
            <h2>Outros canais</h2>
            <p>
                Siga a gente no
                <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">Instragram</a>
            </p>
            <p>
                Ou mande um e-mail:
                <a href="mailto:contato@byteburger.com.br">contato@byteburger.com.br</a>
            </p>
        </section>
    </main>

    <footer>
        <p>
            <a href="#topo">Voltar ao topo</a>
        </p>
        <p>2026 Byte Burguer - Blumenau, SC</p>
    </footer>
</body>

</html>
